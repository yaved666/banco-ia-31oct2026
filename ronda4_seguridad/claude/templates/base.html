<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Brisa Outdoor{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
<header>
  <a class="marca" href="{{ url_for('inicio') }}">Brisa Outdoor</a>
  <nav>
    {% if usuario %}
      <a href="{{ url_for('mis_pedidos') }}">Mis pedidos</a>
      <a href="{{ url_for('perfil') }}">{{ usuario['nombre'] }}</a>
      {% if usuario['rol'] == 'admin' %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
      <a href="{{ url_for('logout') }}">Salir</a>
    {% else %}
      <a href="{{ url_for('login') }}">Entrar</a>
      <a href="{{ url_for('registro') }}">Crear cuenta</a>
    {% endif %}
  </nav>
</header>
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
